syntax = "proto3";

package contribution.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "member/v1/member.proto";

service ContributionService {
  rpc GetCEEPReport(GetCEEPReportRequest) returns (GetCEEPReportResponse) {
    option (google.api.http) = {get: "/api/v1/contributions/ceep" response_body: "report"};
  }
  rpc FinalizeCEEPReport(FinalizeCEEPReportRequest) returns (FinalizeCEEPReportResponse) {
    option (google.api.http) = {post: "/api/v1/contributions/ceep/finalize" body: "*" response_body: "report"};
  }
  rpc ListDarajaPayments(ListDarajaPaymentsRequest) returns (ListDarajaPaymentsResponse) {
    option (google.api.http) = {get: "/api/v1/contributions/daraja-payments"};
  }
  rpc RecoverDarajaPayment(RecoverDarajaPaymentRequest) returns (RecoverDarajaPaymentResponse) {
    option (google.api.http) = {post: "/api/v1/contributions/recover-daraja" body: "*"};
  }
  rpc GetCashContext(GetCashContextRequest) returns (GetCashContextResponse) {
    option (google.api.http) = {get: "/api/v1/contributions/cash-context"};
  }
  rpc GetContributionPayment(GetContributionPaymentRequest) returns (GetContributionPaymentResponse) {
    option (google.api.http) = {get: "/api/v1/contributions/payment-request"};
  }
  rpc GetContributionQuote(GetContributionQuoteRequest) returns (GetContributionQuoteResponse) {
    option (google.api.http) = {get: "/api/v1/contributions/quote"};
  }
  rpc GetCashReceipt(GetCashReceiptRequest) returns (GetCashReceiptResponse) {
    option (google.api.http) = {get: "/api/v1/contributions/cash-receipt"};
  }
  rpc ListCashierSessions(ListCashierSessionsRequest) returns (ListCashierSessionsResponse) {
    option (google.api.http) = {get: "/api/v1/contributions/cashier-sessions"};
  }
  rpc ListCashDeposits(ListCashDepositsRequest) returns (ListCashDepositsResponse) {
    option (google.api.http) = {get: "/api/v1/contributions/cash-deposits"};
  }
  rpc GetCashDeposit(GetCashDepositRequest) returns (GetCashDepositResponse) {
    option (google.api.http) = {get: "/api/v1/contributions/cash-deposit"};
  }
  rpc CreateContributionCharge(CreateContributionChargeRequest) returns (CreateContributionChargeResponse) {
    option (google.api.http) = {
      post: "/api/v1/contributions/charges"
      body: "*"
    };
  }
  rpc ListContributionCharges(ListContributionChargesRequest) returns (ListContributionChargesResponse) {
    option (google.api.http) = {get: "/api/v1/contributions/charges"};
  }
  rpc InitiateDarajaSTKContribution(InitiateDarajaSTKContributionRequest) returns (InitiateDarajaSTKContributionResponse) {
    option (google.api.http) = {
      post: "/api/v1/contributions/initiate-daraja-stk"
      body: "*"
    };
  }
  rpc OpenCashierSession(OpenCashierSessionRequest) returns (OpenCashierSessionResponse) {
    option (google.api.http) = {
      post: "/api/v1/contributions/open-cashier-session"
      body: "*"
    };
  }
  rpc CreateCashContribution(CreateCashContributionRequest) returns (CreateCashContributionResponse) {
    option (google.api.http) = {
      post: "/api/v1/contributions/create-cash"
      body: "*"
    };
  }
  rpc CloseCashierSession(CloseCashierSessionRequest) returns (CloseCashierSessionResponse) {
    option (google.api.http) = {
      post: "/api/v1/contributions/close-cashier-session"
      body: "*"
    };
  }
  rpc AcceptCashHandover(AcceptCashHandoverRequest) returns (AcceptCashHandoverResponse) {
    option (google.api.http) = {
      post: "/api/v1/contributions/accept-cash-handover"
      body: "*"
    };
  }
  rpc RecordCashDeposit(RecordCashDepositRequest) returns (RecordCashDepositResponse) {
    option (google.api.http) = {
      post: "/api/v1/contributions/record-cash-deposit"
      body: "*"
    };
  }
  rpc VerifyCashDeposit(VerifyCashDepositRequest) returns (VerifyCashDepositResponse) {
    option (google.api.http) = {
      post: "/api/v1/contributions/verify-cash-deposit"
      body: "*"
    };
  }
}

// GetCEEPReportRequest identifies a branch month; branch and officer come from authentication.
message GetCEEPReportRequest {
  string period = 1;
  string cutoff = 2;
  string title = 3;
  string parish = 4;
  string payment_date = 5;
}

// GetCEEPReportResponse carries the saved report's decimal-text fields without
// converting money into protobuf Struct numbers, which use binary floating point.
message GetCEEPReportResponse {
  google.protobuf.Struct report = 1;
}

// FinalizeCEEPReportRequest is a separate mutation contract required by the RPC
// conventions; its hash binds approval to the exact reviewed read response.
message FinalizeCEEPReportRequest {
  string period = 1;
  string cutoff = 2;
  string preview_hash = 3;
  string title = 4;
  string parish = 5;
  string payment_date = 6;
}

// FinalizeCEEPReportResponse returns the stored winner on concurrent retries;
// without it callers could mistake their own proposed figures for saved facts.
message FinalizeCEEPReportResponse {
  google.protobuf.Struct report = 1;
}

enum ContributionPaymentRequestStatus {
  CONTRIBUTION_PAYMENT_REQUEST_STATUS_UNSPECIFIED = 0;
  CONTRIBUTION_PAYMENT_REQUEST_STATUS_PENDING     = 1;
  CONTRIBUTION_PAYMENT_REQUEST_STATUS_COMPLETED   = 2;
  CONTRIBUTION_PAYMENT_REQUEST_STATUS_FAILED      = 3;
}

enum ContributionAllocationType {
  CONTRIBUTION_ALLOCATION_TYPE_UNSPECIFIED        = 0;
  CONTRIBUTION_ALLOCATION_TYPE_COM                = 1;
  CONTRIBUTION_ALLOCATION_TYPE_LGOM               = 2;
  CONTRIBUTION_ALLOCATION_TYPE_SHARE_PURCHASE     = 3;
  CONTRIBUTION_ALLOCATION_TYPE_LOAN_PRINCIPAL     = 4;
  CONTRIBUTION_ALLOCATION_TYPE_LOAN_INTEREST      = 5;
  CONTRIBUTION_ALLOCATION_TYPE_PENALTY            = 6;
  CONTRIBUTION_ALLOCATION_TYPE_OTHER_CHARGE       = 7;
  CONTRIBUTION_ALLOCATION_TYPE_OVERPAYMENT_CREDIT = 8;
}

// COM/LGOM may be omitted: the server supplies unpaid monthly fees. Supplied
// fee amounts must match. The receipt total includes these fees in addition to
// the requested share/loan amounts. Loan principal and interest inputs for the
// same loan are combined; Loans determines the actual interest/balance split.
message ContributionAllocationInput {
  ContributionAllocationType type = 1;
  // OTHER_CHARGE/PENALTY target a contribution charge UUID, never a loan UUID.
  string          target_id = 2;
  member.v1.Money amount    = 3;
}

message InitiateDarajaSTKContributionRequest {
  string                               idempotency_key     = 1;
  string                               member_id           = 2;
  int64                                branch_id           = 3;
  string                               phone_number        = 4;
  member.v1.Money                      amount              = 5;
  string                               contribution_period = 6;
  repeated ContributionAllocationInput allocations         = 7;
}

message InitiateDarajaSTKContributionResponse {
  string                           payment_request_id  = 1;
  string                           checkout_request_id = 2;
  ContributionPaymentRequestStatus status              = 3;
  google.protobuf.Timestamp        created_at          = 4;
}

// Either identifier recovers the same stored request; neither initiates payment.
message GetContributionPaymentRequest {
  oneof lookup {
    string payment_request_id = 1;
    string idempotency_key    = 2;
  }
}

// Request completion means payment was received, not that allocations succeeded.
message GetContributionPaymentResponse {
  string                           payment_request_id  = 1;
  ContributionPaymentRequestStatus status              = 2;
  member.v1.Money                  amount              = 3;
  string                           contribution_period = 4;
  google.protobuf.Timestamp        created_at          = 5;
  string                           failure_reason      = 6;
  ContributionPaymentReceipt       receipt             = 7;
  string checkout_request_id = 8;
  string recovery_status = 9;
}

// The receipt's own status prevents collected money being mistaken for a posted contribution.
message ContributionPaymentReceipt {
  string id = 1;
  // Existing receipt states: pending, processing, completed, failed, manual_review.
  string                    status          = 2;
  member.v1.Money           amount          = 3;
  string                    mpesa_reference = 4;
  google.protobuf.Timestamp received_at     = 5;
  repeated ContributionLoanSummary loans = 6;
  bool loan_snapshot_available = 7;
}

message OpenCashierSessionRequest {}

message GetCashContextRequest {}

// Staff identity and permissions come from authentication, never browser input.

// Unpaid fees use the same assessment rules as contribution posting.

message OpenCashierSessionResponse {
  CashierSession session = 1;
}

message CashierSession {
  string                    id                  = 1;
  int64                     branch_id           = 2;
  string                    cashier_id          = 3;
  string                    status              = 4;
  member.v1.Money           expected_amount     = 5;
  member.v1.Money           counted_amount      = 6;
  member.v1.Money           variance            = 7;
  string                    variance_reason     = 8;
  google.protobuf.Timestamp opened_at           = 9;
  google.protobuf.Timestamp closed_at           = 10;
  google.protobuf.Timestamp handed_over_at      = 11;
  google.protobuf.Timestamp deposited_at        = 12;
  string                    handed_over_to      = 13;
  string                    cashier_name        = 14;
  string                    handed_over_to_name = 15;
}

message CreateCashContributionRequest {
  string                               idempotency_key     = 1;
  string                               session_id          = 2;
  string                               member_id           = 3;
  member.v1.Money                      amount              = 4;
  string                               contribution_period = 5;
  repeated ContributionAllocationInput allocations         = 6;
}

message CashContributionReceipt {
  string                         id                         = 1;
  string                         internal_receipt_reference = 2;
  string                         session_id                 = 3;
  string                         status                     = 4;
  member.v1.Money                amount                     = 5;
  google.protobuf.Timestamp      received_at                = 6;
  string                         member_id                  = 7;
  string                         contribution_period        = 8;
  repeated CashReceiptAllocation allocations                = 9;
  repeated ContributionLoanSummary loans = 10;
  bool loan_snapshot_available = 11;
}

message CreateCashContributionResponse {
  CashContributionReceipt receipt = 1;
}

message CloseCashierSessionRequest {
  string          session_id      = 1;
  member.v1.Money counted_amount  = 2;
  string          variance_reason = 3;
}

message CloseCashierSessionResponse {
  CashierSession session = 1;
}

message AcceptCashHandoverRequest {
  string session_id = 1;
}

message AcceptCashHandoverResponse {
  CashierSession session = 1;
}

message RecordCashDepositRequest {
  repeated string session_ids    = 1;
  member.v1.Money amount         = 2;
  string          bank_reference = 3;
}

message CashDeposit {
  string                    id               = 1;
  int64                     branch_id        = 2;
  member.v1.Money           amount           = 3;
  string                    bank_reference   = 4;
  string                    status           = 5;
  google.protobuf.Timestamp recorded_at      = 6;
  google.protobuf.Timestamp verified_at      = 7;
  string                    recorded_by      = 8;
  string                    verified_by      = 9;
  repeated string           session_ids      = 10;
  string                    recorded_by_name = 11;
  string                    verified_by_name = 12;
}

message RecordCashDepositResponse {
  CashDeposit deposit = 1;
}

message VerifyCashDepositRequest {
  string deposit_id = 1;
}

message VerifyCashDepositResponse {
  CashDeposit deposit = 1;
}

// ContributionCharge preserves the obligation and its category for CEEP.
// Without it, partial payments cannot be distinguished from the amount owed.
message ContributionCharge {
  string                    id          = 1;
  string                    member_id   = 2;
  string                    category    = 3;
  member.v1.Money           amount      = 4;
  member.v1.Money           paid        = 5;
  member.v1.Money           outstanding = 6;
  string                    reason      = 7;
  string                    created_by  = 8;
  google.protobuf.Timestamp created_at  = 9;
}

message CreateContributionChargeRequest {
  string idempotency_key = 1;
  string member_id       = 2;
  // literature, caritas_registration, lsf, laptop, penalty (non-loan), or other.
  string          category = 3;
  member.v1.Money amount   = 4;
  string          reason   = 5;
}

message CreateContributionChargeResponse {
  ContributionCharge charge = 1;
}

message ListContributionChargesRequest {
  string member_id  = 1;
  int32  page_size  = 2;
  string page_token = 3;
}

message ListContributionChargesResponse {
  repeated ContributionCharge charges         = 1;
  string                      next_page_token = 2;
}

// These reads let clients resume cash work without guessing fees or trusting browser state.

message GetCashContextResponse {
  string staff_id    = 1;
  int64  branch_id   = 2;
  bool   can_record  = 3;
  bool   can_approve = 4;
  bool   can_approve_credit = 5;
}

message GetContributionQuoteRequest {
  string member_id           = 1;
  string contribution_period = 2;
}

message GetContributionQuoteResponse {
  repeated ContributionAllocationInput fees = 1;
  repeated ContributionLoanSummary loans = 2;
  bool loan_snapshot_available = 3;
}

// Review uses live Loans figures; completed receipts retain the same fields at posting.
// Decimal strings preserve the loan ledger's four decimal places.
message ContributionLoanSummary {
  string loan_id = 1;
  string period = 2;
  string opening_principal = 3;
  string interest_rate = 4;
  string period_interest = 5;
  string earlier_interest_due = 6;
  string interest_due = 7;
  string penalty_due = 8;
  string principal_due = 9;
  string payment = 10;
  string penalty_paid = 11;
  string interest_paid = 12;
  string principal_paid = 13;
  string credit = 14;
  string interest_remaining = 15;
  string principal_remaining = 16;
  bool payable = 17;
}

message GetCashReceiptRequest {
  string receipt_id      = 1;
  string idempotency_key = 2;
}

message CashReceiptAllocation {
  ContributionAllocationType type                       = 1;
  string                     target_id                  = 2;
  member.v1.Money            amount                     = 3;
  string                     status                     = 4;
  string                     authoritative_reference_id = 5;
  // Charge wording captured when cash was recorded; absent on older receipts.
  string                     display_label              = 6;
}

message ListCashierSessionsRequest {
  int32  page_size  = 1;
  string page_token = 2;
}

message ListCashierSessionsResponse {
  repeated CashierSession sessions        = 1;
  string                  next_page_token = 2;
}

message ListCashDepositsRequest {
  int32  page_size  = 1;
  string page_token = 2;
}

message ListCashDepositsResponse {
  repeated CashDeposit deposits        = 1;
  string               next_page_token = 2;
}

message GetCashDepositRequest {
  string deposit_id = 1;
}

message GetCashReceiptResponse {
  CashContributionReceipt receipt = 1;
}

message GetCashDepositResponse {
  CashDeposit deposit = 1;
}

// Recovery lists persist across browsers; the cursor is the last creation time and ID.
message ListDarajaPaymentsRequest { string page_token = 1; }
message ListDarajaPaymentsResponse {
  repeated DarajaPayment payments = 1;
  string next_page_token = 2;
}
message DarajaPayment {
  string payment_request_id = 1;
  string member_id = 2;
  string checkout_request_id = 3;
  member.v1.Money amount = 4;
  string status = 5;
  string recovery_status = 6;
  string receipt_status = 7;
  string mpesa_reference = 8;
  string last_error = 9;
  google.protobuf.Timestamp created_at = 10;
  string provider_result = 11;
}
// Reconciliation requires verified business records; query and retry never initiate STK.
message RecoverDarajaPaymentRequest {
  string payment_request_id = 1;
  string action = 2; // query, restore_checkout, reconcile, retry_posting
  string checkout_request_id = 3;
  string mpesa_reference = 4;
  member.v1.Money amount = 5;
  google.protobuf.Timestamp received_at = 6;
  string evidence = 7;
  string reason = 8;
}
message RecoverDarajaPaymentResponse { GetContributionPaymentResponse payment = 1; }
