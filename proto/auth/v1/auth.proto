syntax = "proto3";

package auth.v1;

import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc CreateStaffUser(CreateStaffUserRequest) returns (CreateStaffUserResponse);
  rpc DeactivateStaffUser(DeactivateStaffUserRequest) returns (DeactivateStaffUserResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  int64 expires_in_seconds = 2;
}

message StaffUser {
  string id = 1;
  int64 branch_id = 2;
  string email = 3;
  string role = 4;
  bool is_active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string name = 8;
}

message CreateStaffUserRequest {
  int64 branch_id = 1;
  string email = 2;
  string password = 3;
  string role = 4;
  string name = 5;
}

message CreateStaffUserResponse {
  StaffUser staff_user = 1;
}

message DeactivateStaffUserRequest {
  string staff_user_id = 1;
}

message DeactivateStaffUserResponse {
  StaffUser staff_user = 1;
}
